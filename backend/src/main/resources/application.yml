spring:
  application:
    name: finlab
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/finlab}
    username: ${DB_USERNAME:finlab}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 30s
server:
  port: ${PORT:8080}
  shutdown: graceful
  forward-headers-strategy: none
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
logging:
  structured:
    format:
      console: ecs
finlab:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    issuer: ${FINLAB_JWT_ISSUER:finlab}
    audience: ${FINLAB_JWT_AUDIENCE:finlab-api}
    ttl: ${FINLAB_JWT_TTL:15m}
    private-key-location: ${FINLAB_JWT_PRIVATE_KEY_LOCATION:}
    public-key-location: ${FINLAB_JWT_PUBLIC_KEY_LOCATION:}
  login:
    hashing-permits: ${FINLAB_LOGIN_HASHING_PERMITS:2}
    hashing-wait: ${FINLAB_LOGIN_HASHING_WAIT:500ms}
    ip-capacity: ${FINLAB_LOGIN_IP_CAPACITY:20}
    email-capacity: ${FINLAB_LOGIN_EMAIL_CAPACITY:10}
    refill-period: ${FINLAB_LOGIN_REFILL_PERIOD:1m}
    max-tracked-keys: ${FINLAB_LOGIN_MAX_TRACKED_KEYS:10000}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
