name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# GitHub Pages 배포를 위한 권한 설정
permissions:
  contents: read
  pages: write
  id-token: write

# 동시 배포 방지
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 저장소 체크아웃
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. (Optional) Spring Boot 백엔드 빌드 - 문서 생성용
      # 백엔드가 준비되면 주석 해제
      # - name: Setup Java
      #   uses: actions/setup-java@v4
      #   with:
      #     distribution: 'temurin'
      #     java-version: '21'
      #     cache: 'maven'
      #
      # - name: Build Spring Boot & Generate Docs
      #   working-directory: backend-samples/spring-boot
      #   run: |
      #     mvn -B clean verify
      #     mkdir -p ../../frontend/public/docs/{apidocs,coverage,tests}
      #
      #     # OpenAPI 스펙 복사
      #     cp target/openapi.json ../../frontend/public/docs/ || true
      #
      #     # Javadoc 복사
      #     cp -r target/site/apidocs/* ../../frontend/public/docs/apidocs/ || true
      #
      #     # JaCoCo 커버리지 리포트 복사
      #     cp -r target/site/jacoco/* ../../frontend/public/docs/coverage/ || true
      #
      #     # 테스트 리포트 복사
      #     cp -r target/surefire-reports ../../frontend/public/docs/tests/ || true

      # 3. Node.js 환경 설정
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      # 4. 의존성 설치
      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # 5. 프론트엔드 빌드
      - name: Build Vue 3 App
        working-directory: frontend
        run: npm run build
        env:
          NODE_ENV: production

      # 6. GitHub Pages 설정
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      # 7. 빌드 결과물 업로드
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      # 8. GitHub Pages에 배포
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
