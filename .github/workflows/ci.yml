name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # `npm run build` runs `vue-tsc -b` (type check, includes *.spec.ts) before `vite build`.
      - name: Type check and build
        run: npm run build

      - name: Unit tests
        run: npm test -- --run

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Verify backend
        run: ./mvnw -B verify
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend contract tooling
        working-directory: frontend
        run: npm ci
      - name: Validate real backend responses with frontend Zod schemas
        working-directory: frontend
        env:
          FINLAB_CONTRACT_ACTUAL_DIR: ${{ github.workspace }}/backend/target/contract-actual
        run: npm test -- --run src/services/api/contract.spec.ts
      - name: Upload backend test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: backend/target/surefire-reports/**
          if-no-files-found: warn
